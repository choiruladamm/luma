name: luma
description: "Luma: EPUB reader dengan terjemahan & makna per paragraf."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  epubx: ^4.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  html: ^0.15.7
  hugeicons: ^1.2.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-400.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-700.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400.ttf
        - asset: assets/fonts/Literata-600.ttf
          weight: 600
