name: CI

# PRs only: branch protection requires PRs to be up to date, so a run after merge would repeat the PR run.
# workflow_dispatch lets deploy.yml check the hotfix back-merge branch, whose push by GITHUB_TOKEN starts no runs.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: fvm
        run: echo "flutter=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: make get FVM=
      - run: make install
      - name: Docs, comments, and linters
        run: scripts/hygiene

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: fvm
        run: echo "flutter=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: make get FVM=
      - run: make test FVM=

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: make install
      - run: make backend-test

  packages-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: make install
      - run: make packages-test

  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: make install
      - run: make dashboard-test
