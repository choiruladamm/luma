name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: make get FVM=
      - run: make backend-install dashboard-install
      - name: Docs, comments, and linters
        run: scripts/hygiene

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: make get FVM=
      - run: make test FVM=

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make backend-install
      - run: make backend-test

  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make dashboard-install
      - run: make dashboard-test
